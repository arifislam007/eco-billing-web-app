services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: econet
      POSTGRES_PASSWORD: econet
      POSTGRES_DB: econet
    volumes:
      - econet_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U econet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://econet:econet@db:5432/econet?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      PORT: 4000
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  econet_pgdata:
