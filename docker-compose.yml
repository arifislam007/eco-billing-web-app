services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: econet
      POSTGRES_PASSWORD: econet
      POSTGRES_DB: econet
    volumes:
      - econet_pgdata:/var/lib/postgresql/data
    # Loopback-only: needed so `npx prisma migrate dev` can run from the
    # host (it writes migration files to the repo - can't run that inside
    # the container, since the image is a COPY snapshot, not a live mount).
    # Never reachable from the LAN or internet, same as the backend port.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U econet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://econet:econet@db:5432/econet?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      PORT: 4000
      RUN_SEED: ${RUN_SEED:-true}
    # Bound to the host's loopback only, for local debugging (curl
    # localhost:4000). Not reachable from the internet or the LAN.
    # The frontend reaches it via the internal "backend:4000" DNS name,
    # proxied through nginx below - it never needs a public port.
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        # Relative path: nginx (see frontend/nginx.conf) proxies /api/* to
        # the backend container internally, so the browser only ever talks
        # to whatever host:port serves the frontend.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    # The only port meant to be reachable publicly.
    ports:
      - "5173:80"

volumes:
  econet_pgdata:
